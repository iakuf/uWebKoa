name: Publish to npm

# 通过 GitHub Release 触发发布
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) 必需，用来向 npm 证明构建来源

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Trusted Publishing 要求 Node >= 22.14.0
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing 要求 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      # 本包没有构建步骤（main 直接指向 src/uWebKoa.js），发布无需安装依赖
      - name: Publish
        run: npm publish
